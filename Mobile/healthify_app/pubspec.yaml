name: healthify_app
description: "HealthyFy — A production-ready health & wellness mobile application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ── State Management ─────────────────────────────────────────────
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # ── Dependency Injection ─────────────────────────────────────────
  get_it: ^8.0.2

  # ── Networking ───────────────────────────────────────────────────
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0

  # ── Serialisation ────────────────────────────────────────────────
  json_annotation: ^4.9.0

  # ── Responsive UI ────────────────────────────────────────────────
  flutter_screenutil: ^5.10.5

  # ── Navigation ───────────────────────────────────────────────────
  go_router: ^15.0.0

  # ── Local Storage ────────────────────────────────────────────────
  shared_preferences: ^2.5.0
  flutter_secure_storage: ^9.2.3

  # ── Assets / UI ──────────────────────────────────────────────────
  flutter_svg: ^2.3.0+1
  cached_network_image: ^3.7.0
  lottie: ^3.2.0
  google_fonts: ^6.3.2

  # ── Utilities ────────────────────────────────────────────────────
  dartz: ^0.10.1
  internet_connection_checker_plus: ^2.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # ── Code Generation ──────────────────────────────────────────────
  build_runner: ^2.5.4
  json_serializable: ^6.10.2

flutter:
  uses-material-design: true

assets:
  - assets/images/
  - assets/icons/
  - assets/animations/
  - assets/fonts/