name: PR Notifier

on:
  pull_request:
    branches: [ develop, main ]

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Comment on PR
        uses: actions/github-script@v6
        with:
          script: |
            const branch = context.payload.pull_request.base.ref;
            let message = `📢 PR opened targeting **${branch}** branch\n`;

            if (branch === "main") {
              message += "🚨 High priority review required";
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            });