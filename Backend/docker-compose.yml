services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: healthify-backend-api
    restart: always
    env_file:
      - .env.docker
    environment:
      - AI_SERVICE_URL=http://healthify-ai-service:8000
      - DB_HOST=healthify-db
      - DB_DATABASE=healthify
      - DB_USERNAME=healthify_user
      - DB_PASSWORD=healthify_password
    volumes:
      - ./.env:/var/www/.env
      - app-storage:/var/www/storage/app
      - app-public:/var/www/public
    depends_on:
      healthify-db:
        condition: service_healthy
    networks:
      - healthify-net
    healthcheck:
      test: ["CMD", "php", "artisan", "about"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  web:
    image: nginx:alpine
    container_name: healthify-nginx
    restart: always
    ports:
      - "8001:80"
    volumes:
      - ./docker-config/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - app-public:/var/www/public:ro
    networks:
      - healthify-net
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

  healthify-db:
    image: mysql:8.0
    container_name: healthify-db
    restart: always
    environment:
      MYSQL_DATABASE: healthify
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_USER: healthify_user
      MYSQL_PASSWORD: healthify_password
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - healthify-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uhealthify_user", "-phealthify_password"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  ai-service:
    build:
      context: ../Ai/inbody-ai-vision
      dockerfile: Dockerfile
    container_name: healthify-ai-service
    restart: always
    ports:
      - "8080:8000"
    volumes:
      - ai-model-cache:/root/.cache/huggingface
    networks:
      - healthify-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  healthify-net:
    driver: bridge

volumes:
  dbdata:
  app-storage:
  app-public:
  ai-model-cache:
