services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: healthify-backend-api
    restart: unless-stopped
    env_file:
      - .env.docker
    secrets:
      - db_password
      - mail_password
      - firebase_credentials
    volumes:
      - app-storage:/var/www/storage/app
      - app-public:/var/www/public
    depends_on:
      healthify-db:
        condition: service_healthy
    networks:
      - healthify-net

  web:
    image: nginx:alpine
    container_name: healthify-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./docker-config/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - app-public:/var/www/public:ro
    depends_on:
      - app
    networks:
      - healthify-net

  healthify-db:
    image: mysql:8.0
    container_name: healthify-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: healthify
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_password
      MYSQL_USER: healthify_user
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - healthify-net
    healthcheck:
      test: ["CMD", "sh", "-c", "mysqladmin ping -h localhost -uroot -p\"$$(cat /run/secrets/db_password)\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  ai-service:
    build:
      context: ../Ai/inbody-ai-vision
      dockerfile: Dockerfile
    container_name: healthify-ai-service
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - ai-model-cache:/root/.cache/huggingface
    networks:
      - healthify-net

networks:
  healthify-net:
    driver: bridge

volumes:
  dbdata:
  app-storage:
  app-public:
  ai-model-cache:
